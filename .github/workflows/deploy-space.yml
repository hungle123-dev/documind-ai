name: Deploy HuggingFace Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "agents/**"
      - "config/**"
      - "document_processor/**"
      - "retriever/**"
      - "utils/**"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/deploy-space.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HuggingFace Hub client
        run: python -m pip install "huggingface_hub>=0.36.0"

      - name: Verify Space artifacts
        run: |
          test -f app.py
          test -f requirements.txt
          test -f README.md

      - name: Upload Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "")
          repo_id = os.environ.get("HF_SPACE", "")
          if not token or not repo_id:
              print("Skipping HuggingFace deploy because HF_TOKEN or HF_SPACE is not configured.")
              raise SystemExit(0)

          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
          )
          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              token=token,
              commit_message="Deploy DocuMind AI from GitHub Actions",
              ignore_patterns=[
                  ".git*",
                  ".env*",
                  ".pytest*",
                  ".test-tmp*",
                  ".runtime-validation*",
                  "__pycache__/*",
                  "app.log",
                  "document_cache/*",
                  "chroma_db/*",
                  "uploads/*",
                  "*.pdf",
                  "*.docx",
                  "*.pptx",
                  "*.xlsx",
                  "*.zip",
                  "*.tar",
                  "*.tar.gz",
              ],
          )
          print(f"https://huggingface.co/spaces/{repo_id}")
          PY
